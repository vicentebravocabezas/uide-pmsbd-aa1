    <head>
        <meta charset="UTF-8" />

        <title>Granito Coffee Shop | Clima</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />
        <script type="module" src="js/clima.js"></script>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="brand">
                    <img src="/media/logo-horizontal-white.svg" />
                </div>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/empresa.html">Empresa</a>
                    <a href="/productos.html">Productos</a>
                    <a href="/oferta-del-mes.html">Oferta del mes</a>

                    <a href="/noticias.html">Noticias</a>

                </div>
            </nav>
        </header>

        <main class="width-lg">
            <h2 class="title">Clima</h2>
            <p class="description">Temperatura y clima actual en Quito.</p>

            <section class="panel weather">
                <button type="button" id="btn-clima" class="btn-submit">
                    Ver clima
                </button>

                <div id="clima-result" class="hidden">
                    <ul class="clima-lista">
                        <li>
                            <strong>Temperatura:</strong>
                            <span id="clima-temp"></span>
                        </li>
                        <li>
                            <strong>Humedad:</strong>
                            <span id="clima-humedad"></span>
                        </li>
                        <li>
                            <strong>Descripción del clima:</strong>
                            <span id="clima-desc"></span>
                        </li>
                        <li>
                            <strong>Viento:</strong>
                            <span id="clima-viento"></span>
                        </li>
                    </ul>
                </div>
            </section>
        </main>

        <footer>
            <p>
                <strong>Granito Coffee Shop</strong><br />
                La Carolina, Quito<br />
                2026 Granito Coffee Shop |
                <a href="vibravoca@uide.edu.ec">vibravoca@uide.edu.ec</a>
            </p>
        </footer>
